[project]
name = "n6ol-powerline-qrm-monitor"
version = "1.2.0"
description = "Continuous powerline interference monitor for ham radio operators"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Nicklas Johnson" }
]
urls = { Homepage = "https://n6ol.us/" }
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=2.0",
    "numba>=0.60",
    "scipy>=1.17",
    "matplotlib>=3.10",
    "paramiko>=3.4",
    "jinja2>=3.1",
    "tomli-w",
    "tzdata",
]
keywords = ["ham radio", "amateur radio", "powerline", "QRM", "interference", "monitoring"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
]
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["lib/buzz", "configure"]
omit = ["tests/*", "lib/buzz/device_setup.py"]

[tool.coverage.report]
# Raised 96 -> 97 once NUMBA_DISABLE_JIT=1 (see tests/conftest.py) made JIT-compiled
# function bodies visible to coverage.py.  Before that, every @njit function counted
# as untested no matter how well exercised, which held the achievable ceiling down.
fail_under = 97
show_missing = true
