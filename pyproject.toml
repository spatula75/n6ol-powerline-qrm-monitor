[project]
name = "n6ol-powerline-qrm-monitor"
version = "1.5.0"
description = "Continuous powerline interference monitor for ham radio operators"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Nicklas Johnson" }
]
urls = { Homepage = "https://n6ol.us/" }
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=2.0",
    "numba>=0.60",
    "scipy>=1.17",
    "matplotlib>=3.10",
    # The display window. main.py falls back to headless when this is missing, which
    # is for service installs that truly have no display stack -- not a statement
    # that the GUI is optional, so it belongs here rather than in an extra.
    "PySide6>=6.7",
    "paramiko>=3.4",
    "jinja2>=3.1",
    "tomli-w",
    "tzdata",
    # The setup program's schema: validation for ~/.buzz/config.toml, and the source
    # both the setup program's screens and config.example.toml are built from.
    "jsonschema>=4.20",
    # The setup program's terminal UI.
    "textual>=8.2",
]
keywords = ["ham radio", "amateur radio", "powerline", "QRM", "interference", "monitoring"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
]
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests are deselected by default: they drive real threads at real
# speed, so they cost tens of seconds each where the unit suite costs milliseconds.
# `pytest` stays the fast feedback loop that CI runs; `pytest -m integration
# --no-cov` runs the slow one (--no-cov because the coverage gate is calibrated
# against the unit suite, and measuring a different subset against it fails).
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end over real threads and real time; slow, deselected by default",
]

[tool.coverage.run]
source = ["lib/buzz", "tools"]
omit = ["tests/*", "lib/buzz/setup/device_setup.py"]

[tool.coverage.report]
# Raised 96 -> 97 once NUMBA_DISABLE_JIT=1 (see tests/conftest.py) made JIT-compiled
# function bodies visible to coverage.py.  Before that, every @njit function counted
# as untested no matter how well exercised, which held the achievable ceiling down.
fail_under = 97
show_missing = true
