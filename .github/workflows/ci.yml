name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        # --cov-fail-under intentionally omitted: pyproject.toml's
        # [tool.coverage.report] fail_under is the single source of truth for
        # the gate. A CLI flag here would silently override it.
        #
        # conftest.py sets NUMBA_DISABLE_JIT=1, so @njit functions run as plain
        # Python and coverage.py can actually see their bodies -- machine code
        # executes no bytecode to trace.
        run: pytest tests/ --cov

      - name: Run tests against the compiled Numba path
        # The interpreted and JIT'd paths are not automatically equivalent: the
        # interpreter applies NumPy's NEP 50 promotion to mixed float32/float64
        # arithmetic while Numba types the expression itself, and
        # average_pulse_amplitude returned measurably different answers under the
        # two before an explicit cast fixed it.  The run above cannot catch that
        # class of bug by construction, so the suite runs a second time against
        # the code production actually executes.  No coverage here -- that is the
        # first run's job, and this one cannot report it anyway.
        env:
          NUMBA_DISABLE_JIT: "0"
        run: pytest tests/

  integration:
    # A separate job rather than another step, so it runs alongside the unit suite
    # instead of after it.  It costs a minute of wall clock where the unit suite
    # costs seconds, and a PR should not wait the two end to end for an answer.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run the integration suite
        # --no-cov because the gate in pyproject.toml is calibrated against what the
        # unit suite reaches; this run touches a different subset of the code and
        # measuring it against that number fails for no reason worth acting on.
        #
        # These are timing-sensitive by construction -- playback is real-time because
        # pacing is what is under test.  Their assertions are properties ("locked
        # within N seconds", "the position advanced") rather than exact numbers, so a
        # loaded runner makes them slow rather than red.  A flake here is a bug in the
        # test and should be fixed as one, not retried away.
        run: pytest -m integration --no-cov
