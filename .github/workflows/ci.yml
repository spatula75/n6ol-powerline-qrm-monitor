name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PortAudio (required by sounddevice)
        run: sudo apt-get install -y libportaudio2

      - name: Install Qt runtime libraries (required by PySide6)
        # PySide6's compiled QtGui extension dynamically links against these at
        # import time -- not just when a window is actually shown -- so even the
        # pure-function tests in test_waterfall_math.py need them, despite never
        # creating a QApplication or a display.  The bare ubuntu-latest runner
        # doesn't ship any of them.  libegl1/libgl1/libxkbcommon0 are the
        # well-known minimum for QtGui to import cleanly on headless Linux; if a
        # future PySide6 bump needs more, the ImportError will name the next
        # missing .so and it can be added here.
        run: sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        # --cov-fail-under intentionally omitted: pyproject.toml's
        # [tool.coverage.report] fail_under is the single source of truth for
        # the gate. A CLI flag here would silently override it.
        #
        # conftest.py sets NUMBA_DISABLE_JIT=1, so @njit functions run as plain
        # Python and coverage.py can actually see their bodies -- machine code
        # executes no bytecode to trace.
        run: pytest tests/ --cov

      - name: Run tests against the compiled Numba path
        # The interpreted and JIT'd paths are not automatically equivalent: the
        # interpreter applies NumPy's NEP 50 promotion to mixed float32/float64
        # arithmetic while Numba types the expression itself, and
        # average_pulse_amplitude returned measurably different answers under the
        # two before an explicit cast fixed it.  The run above cannot catch that
        # class of bug by construction, so the suite runs a second time against
        # the code production actually executes.  No coverage here -- that is the
        # first run's job, and this one cannot report it anyway.
        env:
          NUMBA_DISABLE_JIT: "0"
        run: pytest tests/
