name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PortAudio (required by sounddevice)
        run: sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        # --cov-fail-under intentionally omitted: pyproject.toml's
        # [tool.coverage.report] fail_under is the single source of truth for
        # the gate. A CLI flag here would silently override it.
        run: pytest tests/ --cov
