# N6OL Powerline QRM Monitor - example configuration
#
# Copy this file to ~/.buzz/config.toml and edit to suit your setup, or let the
# setup program write it for you:
#
#     setup.bat                (Windows)
#     ./setup.sh               (Linux / macOS / BSD)
#
# Every option the monitor understands appears here, with the value shown being the
# default. Options that are commented out have no useful default: either the monitor
# works it out, the feature is off, or the setup program fills them in.
#
# GENERATED FILE - edit lib/buzz/setup/schema.json and regenerate, do not edit here.


# The sound card the receiver feeds, and what it sends.
[audio]
# The sound card that carries the RF-to-audio converted signal.
#
# Choose this in Setup's Audio step. Do not type it. Setup probes every
# input, shows a level bar for each, and writes the name for you.
#
# The monitor finds the device by this name at every start. It never uses a
# stored index. Names survive a reboot. Indices do not.
#
# Default: Whatever Setup finds on your machine. The value shown names one
# Default: sound card and is only an example.
# input_device_name = "Line In (Realtek(R) Audio), Windows DirectSound"

# The audio sample rate. It must match a rate the input device uses.
#
# The monitor enforces this band. It does not treat it as advice.
#
# Below 8000 Hz the 4 kHz that the waterfall and the analysis look at sits
# above Nyquist. Nothing is there to measure.
#
# Above 48000 Hz the ring buffer is a fixed size, so it holds too little
# history for the analyzer to acquire the way it was tuned. A powerline arc
# has nothing to say up there anyway.
#
# 16000 Hz is enough for this measurement and keeps CPU load low. That
# matters for a monitor that runs all day without an operator.
sample_rate = 16000

# Impulses per second from the mains. This is twice the grid frequency,
# because an arc fires on both peaks.
#
#   120 pps - 60 Hz grid (North America)
#   100 pps - 50 Hz grid (Europe and most other places)
pulse_rate = 120


# Who measures, from where, and the calibration that turns audio into dBm.
[station]
# Your amateur radio callsign. It appears in page titles and plot labels.
callsign = "N0CALL"

# The IANA timezone name for CSV timestamps and graph labels, such as
# America/Los_Angeles.
timezone = "America/Los_Angeles"

# Where the monitor writes CSV files, plots, and the index page.
#
# Recordings go to a 'recordings' folder under this path, unless the
# recording section names a directory of its own.
#
# Default: Your home directory, resolved when the program starts.
# path = "C:\\Users\\yourname"

# The baseline for the noise-floor reference line on the daily graph.
#
# You may want to adjust this after gathering a few days of data, to see
# what is typical for your area in the absence of any utility noise.
noise_floor = -98.0

# How far above the noise floor a reading must sit to count as interference
# in the probability summaries.
noise_min_snr = 12.0

# The offset that converts audio amplitude to RF level at the receiver
# input.
#
# This number is added to the audio level to approximate the RF level in dBm
# at the receiver input. For example, if your radio's own S-meter reads -64
# dBm and the sound card sees -32 dB of audio for that same signal, set this
# to -32.
#
# Most receivers: leave this alone. Open the Calibration meter on the Audio
# page instead, and adjust the RF and AF gain on the receiver until its own
# S-meter agrees with the reading there.
#
# Some receivers have no AF gain to adjust - one with its own internal sound
# device, for instance. Choose this field itself to open a live meter of its
# own: Up and Down nudge the offset, Space resets it to the default, and
# Enter confirms.
#
# S9 is -73 dBm, and each S-unit is 6 dB.
#
# Set the radio up for measurement first: AGC off, widest filter, SSB,
# preamp and attenuator off. Tune where the antenna is resonant and bypass
# the tuner.
audio_rf_conversion_db = -32.0

# Publish a probability summary covering your whole data set, alongside the
# 7-day and 30-day ones.
#
# The 7-day and 30-day summaries are always published. This adds a third
# chart, starting at summary_start_date_iso.
#
# Turn it on where your noise situation is not changing. Older data
# otherwise dilutes the recent.
enable_all_time_summary = false

# The ISO 8601 date that the all-time probability summary graph starts from.
summary_start_date_iso = "2024-01-01T00:00:00+0000"


# Weather readings logged beside each measurement. Arcing follows humidity
# and wind, so these are worth keeping.
[weather]
# Where weather readings come from. Choose none to leave those CSV columns
# empty.
#
#   CumulusMX - a weather station on your own network
#   Open-Meteo - a free public API that needs no account
#   None - leave the weather columns empty
source = "cumulusmx"

# The JSON endpoint of your CumulusMX installation.
#
# Change the query string tags to match the fields your station publishes.
#
# You should normally only change the hostname and port here.
# Example:
# http://cumulusmx.local:8998/api/tags/process.json?temp&hum&SolarRad&wspeed&wgust&avgbearing
url = ""

# The latitude that Open-Meteo looks up.
#
# Unset by default.
# latitude =

# The longitude that Open-Meteo looks up.
#
# Unset by default.
# longitude =


# Upload plots and data to a web server over SCP, so anyone can see the
# results. This is off by default, and the monitor then runs on this machine
# alone.
[server]
# Upload output files after each collection cycle. The monitor ignores every
# setting below while this is off.
enabled = false

# The hostname or IP address of the web server that holds the published
# output.
# Example: yourserver.example.com
host = ""

# The account to log in as on that server.
# Example: yourname
username = ""

# Where uploaded files go on the server. End it with a slash.
# Example: /var/www/html/noise/
remote_path = ""

# The private key that authenticates the upload. It must have no passphrase,
# so uploads run without an operator.
#
# Generate one with: ssh-keygen -t ed25519 -f ~/.buzz/buzz.pem -N ""
#
# Append ~/.buzz/buzz.pem.pub to the server account's
# ~/.ssh/authorized_keys. Confirm that the key works before you switch
# uploads on.
#
# On Windows, use forward slashes or double backslashes. TOML reads one
# backslash as the start of an escape sequence.
#
# Default: buzz.pem inside the .buzz folder in your home directory.
# key_path = "C:/Users/yourname/.buzz/buzz.pem"

# How the web page finds today's chart. The page reads one fixed address,
# data/current.png, so it never has to work out today's filename.
#
#   Copy - upload the chart a second time under the fixed name
#   Symlink - point the fixed name at today's chart
#
# Copy works on every web server and needs no configuration. It uploads one
# extra chart per minute, around 85 kB.
#
# Symlink saves that upload, but the web server has to follow symbolic
# links. Apache needs FollowSymLinks for the upload directory, and some
# shared hosts refuse to allow it. Nginx and lighttpd follow links by
# default.
#
# If the page shows a broken image after you choose symlink, the server is
# not following the link. Switch back to copy.
current_chart = "copy"


# Save interference events as .wav files. Replay one later with --playback,
# or render it to video with --render.
[recording]
# Start with recording armed. The Record button, or the R key, toggles it
# while the monitor runs. The --enable-recording flag arms it for one run.
#
# A recording starts when the analyzer locks onto the pulse train. It ends
# once the signal has been gone for stop_after_seconds.
#
# It opens with the audio the monitor had already buffered at the moment of
# the lock, and it ends with the silence it waited through. An event that
# starts and ends while the monitor runs is therefore captured whole, with a
# run-up and a run-out around it.
enabled = false

# Where the monitor writes .wav files. Leave it empty to use a 'recordings'
# folder under the station output path.
#
# The --playback flag also looks here when you give it a bare filename
# instead of a path.
#
# Default: A 'recordings' folder under the station output path.
# directory = "C:/Users/yourname/recordings"

# How many of the next events to capture before recording disarms itself.
# Set 0 to record every event until you switch recording off.
max_events = 10

# How often to refill that budget, which makes it a rate instead of a
# one-off. 1440 gives max_events every day. Set 0 to never re-arm.
#
# The cycle runs from the last reset, not from the moment the budget ran
# out. It therefore keeps its time of day instead of sliding later by
# however long each day's events took to arrive.
#
# A quiet period does not carry unused events forward. Switching recording
# off by hand also cancels the cycle.
rearm_reset_minutes = 0.0

# How much of the interference to record, measured from the lock. Set 0 to
# record the whole event however long it runs.
#
# This measures the event, not the file. The run-up that the ring buffer
# already held comes free on top, and so does the trailer afterward. The
# .wav on disk is therefore always longer than this.
#
# A min_lock_seconds wait counts against this, because the monitor keeps
# those seconds and they are part of the event. Three seconds there and ten
# here give ten seconds of event, not thirteen.
#
# A min_lock_snr wait does not count. That wait is open-ended, and charging
# it would spend the whole allowance before the file even opened.
#
# Expect an overrun of up to 200 ms. The recorder polls rather than watching
# continuously.
#
# A capped recording does not roll over into a second file. The monitor
# skips the rest of that event and starts the next file at the next event.
# The cap always wins over stop_after_seconds.
max_seconds = 120.0

# How many seconds without a lock end a recording. The monitor keeps this
# audio, so it also sets how much trailer every recording ends with.
#
# Raise it if one flickering signal splits across several files. Lower it to
# trim dead air off the end.
stop_after_seconds = 10.0

# How long the interference must hold before a recording starts. Set 0 to
# record every lock, however brief.
#
# A night of two-second blips otherwise fills the directory with files too
# short to replay.
#
# Keep it to five seconds or less. The lead-in pays for it, because that
# audio comes from a sliding window a few seconds long. Wait two seconds and
# every recording opens two seconds later against the event.
#
# The monitor clamps the value to the lower of the buffer length and
# max_seconds. It warns and says which one it used.
min_lock_seconds = 0.0

# How loud the interference must be before a recording starts. This keeps
# barely audible events off the disk.
#
# This affects recording alone. It does not change when the analyzer locks,
# measures, logs, or draws. That happens at a fixed 6 dB SNR in the code, so
# any value at or below 6 does nothing.
#
# A signal that starts quiet and grows louder is not skipped. Recording
# starts the moment it crosses, so the monitor catches the event even when
# it misses the opening seconds.
#
# The lead-in pays for the wait, and the lead-in runs out. This differs from
# min_lock_seconds, which the monitor can clamp: this wait depends on the
# signal rather than the clock. Something in the low teens is a reasonable
# place to start.
min_lock_snr = 0.0


# Where to find ffmpeg. Only --render and the loudness probe that feeds it
# need it. Only specify this if it cannot be found on the PATH.
[render]
# Leave this empty to search PATH, where a normal install puts ffmpeg.
#
# Set it only when ffmpeg sits somewhere PATH does not reach. Two cases: a
# Windows build unzipped into a folder, and winget's shim directory in a
# terminal you have not restarted since the install.
#
# Either the binary or the folder that holds it will do. A copy on PATH wins
# over this setting.
#
# A monitor that never renders never looks for ffmpeg, so an empty value
# costs nothing.
# Example: C:/Users/yourname/AppData/Local/Microsoft/WinGet/Links
ffmpeg_path = ""
